<!DOCTYPE html>

<html>
    <head>
        <title>PowerPIT - Register</title>

        <link rel="stylesheet" href="register.css">
    </head>
    <body>
        <header>
            <a href="index.html"><img src="https://fastly.picsum.photos/id/180/50/50.jpg?hmac=XMW9Xfp3fH-OoI44sBBOzJib8r8soPYbeUHO0d-OT20" alt="logo" width="50" height="50"></a>
            <nav id="tabs">
                <ul>
                    <li><a href="index.html" class="tab">About us</a></li>
                    <li><a href="index.html" class="tab">Classes</a></li>
                    <li><a href="index.html" class="tab">Trainers</a></li>
                    <li><a href="index.html" class="tab">Equipment</a></li>
                </ul>
            </nav>
            <div class="signup">
                <a href="register.html" class="small-button">Register</a>
                <a href="login.html" class="small-button-light">Login</a>
            </div>
        </header>
        <main>
            <section class="register_page">

                <header class="register-header">
                    <h1>Create Account</h1>
                    <p>Join PowerPIT Today!</p>
                </header>

                <form class="register_form" action="register.php" method="post">
                    <label>
                        Full Name:
                        <input type="text" name="name" required>
                    </label>

                    <label>
                        Username:
                        <input type="text" name="username" required>
                    </label>

                    <label>
                        Email:
                        <input type="email" name="email" required>
                    </label>

                    <label>
                        Password:
                        <input type="password" name="password" required>
                    </label>

                    <label>
                        Confirm Password:
                        <input type="password" name="confirm_password" required>
                    </label>

                    <button type="submit">Create account</button>
                </form>

                <p class="login_link">
                    Already have an account? <a href="login.html">Log in</a>
                </p>
            </section>
        </main>
    </body>
</html>
